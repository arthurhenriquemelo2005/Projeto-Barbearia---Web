<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/main.css">
    <link rel="stylesheet" href="./styles/login.css">

    <title>Barbearia</title>
</head>

<body>

    <form id="Login" class="login-form">

        <h1>Barbearia</h1>
        <p>Entre na sua conta</p>

        <div class="login-container">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Insira seu e-mail" required>
        </div>

        <div class="login-container">
            <label for="senha">Senha</label>

            <div class="senha-container">
                <input type="password" id="senha" placeholder="Insira sua senha" required>

                <button type="button" id="mostrarSenha" class="btn-olho">
                    👁
                </button>
            </div>
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>

        <button type="submit">Entrar</button>

        <div class="cadastro">
            <span>Não possui uma conta?</span>

            <button type="button" id="btnCadastro" class="btn-cadastro">
                Criar conta
            </button>
        </div>

    </form>

    <script type="module" src="./scripts/autenticar.js"></script>
    <script src="./scripts/efeitoSenha.js"></script>
</body>

</html>
